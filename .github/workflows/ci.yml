name: Go checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Read-only rendering benchmarks
        run: go test ./internal/tui -run '^
      - name: Build
        run: go build ./cmd/docktop
      - name: Read-only sampler smoke test
        run: |
          bash -n scripts/benchmark-process.sh
          tmpdir=$(mktemp -d)
          cp "$(command -v sleep)" "$tmpdir/docktop"
          "$tmpdir/docktop" 4 &
          pid=$!
          bash scripts/benchmark-process.sh "$pid" 2 1
          wait "$pid"
 -bench '^(BenchmarkDashboardView|BenchmarkBrailleGraphs)
      - name: Build
        run: go build ./cmd/docktop
      - name: Read-only sampler smoke test
        run: |
          bash -n scripts/benchmark-process.sh
          tmpdir=$(mktemp -d)
          cp "$(command -v sleep)" "$tmpdir/docktop"
          "$tmpdir/docktop" 4 &
          pid=$!
          bash scripts/benchmark-process.sh "$pid" 2 1
          wait "$pid"
 -benchmem -benchtime=300ms -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/docktop
      - name: Read-only sampler smoke test
        run: |
          bash -n scripts/benchmark-process.sh
          tmpdir=$(mktemp -d)
          cp "$(command -v sleep)" "$tmpdir/docktop"
          "$tmpdir/docktop" 4 &
          pid=$!
          bash scripts/benchmark-process.sh "$pid" 2 1
          wait "$pid"
