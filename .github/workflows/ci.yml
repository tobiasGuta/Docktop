name: Go checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve modules
        run: go mod tidy -diff
      - name: Test
        run: go test -race -mod=readonly ./...
      - name: Read-only rendering benchmarks
        run: go test ./internal/tui -run '^$' -bench '^(BenchmarkDashboardView|BenchmarkBrailleGraphs|BenchmarkDashboardBody|BenchmarkCanvasPaint|BenchmarkPanelFrame)$' -benchmem -benchtime=300ms -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/docktop
      - name: Read-only sampler smoke test
        run: |
          bash -n scripts/benchmark-process.sh
          tmpdir=$(mktemp -d)
          cat > "$tmpdir/main.go" <<'EOF'
          package main

          import (
              "os"
              "time"
          )

          func main() {
              if err := os.WriteFile(os.Args[1], nil, 0600); err != nil {
                  panic(err)
              }
              time.Sleep(6 * time.Second)
          }
          EOF
          go build -o "$tmpdir/docktop" "$tmpdir/main.go"
          "$tmpdir/docktop" "$tmpdir/ready" &
          pid=$!
          for attempt in {1..50}; do
            [[ -f "$tmpdir/ready" ]] && break
            sleep 0.1
          done
          [[ -f "$tmpdir/ready" ]]
          bash scripts/benchmark-process.sh "$pid" 2 1
          wait "$pid"
